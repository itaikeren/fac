[package]
name = "fac-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Fig-style autocomplete for the macOS terminal: a popup of subcommands, options, files and history drawn inside any terminal"
license = "MIT"
repository = "https://github.com/itaikeren/fac"
homepage = "https://github.com/itaikeren/fac"
readme = "README.md"
keywords = ["autocomplete", "terminal", "zsh", "completion", "fig"]
categories = ["command-line-utilities"]
include = [
    "/src/",
    "/specs/fig.zst",
    "/specs/index.txt",
    "/shell/",
    "/tools/fig-specs/pack.rs",
    # Read by unit tests in src/.
    "/tests/fixtures/fig-parse/expected.json",
    "/tests/fixtures/palettes/",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
]

[lib]
name = "fac"
path = "src/lib.rs"

[[bin]]
name = "fac"
path = "src/main.rs"

# Packs Fig's specs into specs/fig.zst; run through tools/fig-specs/update.sh.
[[bin]]
name = "fac-pack-specs"
path = "tools/fig-specs/pack.rs"
required-features = ["pack"]

[features]
pack = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# QuickJS runs spec code under wall-time budgets (200 ms to evaluate a spec),
# so it (and rquickjs's allocator glue, on every allocation) is optimised in
# debug and test builds too.
[profile.dev.package.rquickjs-sys]
opt-level = 3

[profile.dev.package.rquickjs-core]
opt-level = 3

[dependencies]
anyhow = "1.0.104"
getrandom = "0.4.3"
libc = "0.2.191"
memchr = "2.8.3"
nix = { version = "0.31.3", features = ["term", "poll", "signal", "process", "fs", "event"] }
nucleo-matcher = "0.3.1"
oxc_allocator = "0.155.0"
oxc_ast = "0.155.0"
oxc_codegen = "0.155.0"
oxc_diagnostics = "0.155.0"
oxc_parser = "0.155.0"
oxc_semantic = "0.155.0"
oxc_span = "0.155.0"
oxc_transformer = "0.155.0"
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
rquickjs = { version = "0.14.0", default-features = false, features = ["std", "rust-alloc", "loader"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
signal-hook = "0.4.5"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-width = "0.2.2"
vt100 = "=0.18.1"
zstd = "0.14.3"

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
