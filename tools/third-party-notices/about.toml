# cargo-about config: the Rust crates compiled into the release binary on macOS.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
workarounds = []

# self_cell is Apache-2.0 OR GPL-2.0-only; fac uses it under Apache-2.0.
[self_cell]
accepted = ["Apache-2.0"]
